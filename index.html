*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.5;

/* 상단 요약 */
.top{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}

.hero{padding:24px 26px 22px}

.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--navy)}
h1{margin:10px 0 12px;font-size:clamp(21px,2.6vw,28px);line-height:1.3;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.fold>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2);padding:6px 0;list-style:none}
.fold>summary::before{content:"▸ "}.fold[open]>summary::before{content:"▾ "}
.fold>summary::-webkit-details-marker{display:none}
.kinds{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.kinds .chip{background:var(--surface);border:1px solid var(--line);color:var(--chip-ink);font-weight:600}
.updated{display:inline-flex;gap:6px;margin-top:14px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--ink-2);background:var(--surface-2)}
.install{position:fixed;top:10px;right:10px;z-index:50;height:38px;padding:0 14px;border:2px solid #fff;border-radius:19px;background:#e8590c;color:#fff;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.install[hidden]{display:none}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}
.stat{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.stat:hover{border-color:var(--navy)}
.stat[aria-pressed="true"]{border-color:var(--navy);background:var(--surface);box-shadow:inset 3px 0 0 var(--navy)}
.stat .label{font-size:12.5px;color:var(--muted)}
.stat .value{font-size:26px;font-weight:700;margin-top:2px}
.stat .hint{font-size:11.5px;color:var(--muted)}

.picks{padding:18px 0 8px;display:flex;flex-direction:column}
.picks h2{margin:0 18px 10px;font-size:13px;font-weight:600;color:var(--ink-2)}
.picks ol{list-style:none;margin:0;padding:0}
.picks li a{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;padding:10px 18px;text-decoration:none;border-top:1px solid var(--line-2)}
.picks li a:hover{background:var(--surface-2)}
.rank{width:28px;height:28px;border-radius:7px;background:var(--navy);color:var(--navy-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.picks .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picks .s{font-size:12px;color:var(--muted)}
.picks .empty{padding:14px 18px;color:var(--muted);font-size:13px}

.filters{display:grid;grid-template-columns:minmax(0,1fr) repeat(4,minmax(0,170px));gap:10px;margin-top:18px}
.field{position:relative}
.field input,.field select{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 14px;appearance:none;-webkit-appearance:none}

.field input::placeholder{color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 12px}
.tab{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:600;color:var(--ink-2)}

.tab[aria-pressed="true"] .c{background:rgba(255,255,255,.18);color:var(--surface)}

.p-hot{background:var(--hot-bg);color:var(--hot-ink)} .p-info{background:var(--info-bg);color:var(--info-ink)}

.foot details{flex-basis:100%}

    else if (dl!==null && dl<0) e._st = {k:'closed', t:'접수마감', c:'p-off'};
    else if (dl!==null && dl<=7) e._st = {k:'closing', t:'마감임박', c:'p-hot'};
    else e._st = {k:'open', t:'접수중', c:'p-warn'};
    e._closing = e._st.k==='closing';
    e._hay = [e.title,e.host,e.place,e.region,e.kind,e.tags.join(' '),e.sources.join(' ')].join(' ').toLowerCase();
  });

  var state = {tabs:[], quick:'all', q:'', field:'', region:'', group:'', sort:'start'};
  try { var saved = JSON.parse(localStorage.getItem('evr-state')||'{}'); if(['start','deadline','new'].indexOf(saved.sort)>=0) state.sort=saved.sort; } catch(_){}

  // 상단 요약
  if (window.matchMedia('(min-width:761px)').matches) document.getElementById('fold').open = true;  // 폰에서는 접어 둠
  document.getElementById('updated').textContent = '최근 업데이트 '+D.updated+' · 매주 월요일 07:00 갱신';
  document.getElementById('kindChips').innerHTML = KINDS.map(function(k){return '<span class="chip">'+k+'</span>';}).join('')+'<span>행사 성격별로 나눠 신청 가능한 일정과 마감 임박 행사를 빠르게 확인하세요.</span>';
  document.getElementById('st-all').textContent = EV.length;
  document.getElementById('st-new').textContent = EV.filter(function(e){return e.is_new;}).length;
  document.getElementById('st-auto').textContent = EV.filter(function(e){return e._auto;}).length;
  document.getElementById('st-ax').textContent = EV.filter(function(e){return e._ax;}).length;

  // 추천: 아직 신청 가능한 행사 중 신청 마감이 가까운 순 (자동차·전장 행사 우선), 마감일 없으면 개최일 순
  var picks = EV.filter(function(e){return e._st.k==='open'||e._st.k==='closing';})
    .sort(function(a,b){return (b._auto-a._auto) || (a._dl==null?999:a._dl)-(b._dl==null?999:b._dl) || a._ds-b._ds;}).slice(0,5);
  document.getElementById('picks').innerHTML = picks.length ? picks.map(function(e,i){
    var when = e.deadline ? '신청 마감 '+fmtShort(e.deadline)+(e._dl!=null?' (D-'+e._dl+')':'') : '개최 '+fmtShort(e.start);
    return '<li><a href="'+esc(e.url)+'" target="_blank" rel="noopener"><span class="rank">'+(i+1)+'</span><span><div class="t">'+esc(e.title)+'</div><div class="s">'+esc(e.kind)+' · '+when+'</div></span></a></li>';
  }).join('') : '<li class="empty">신청 가능한 추천 행사가 없습니다.</li>';

  // 필터 옵션
  function fill(id, vals){ var el=document.getElementById(id); vals.forEach(function(v){ var o=document.createElement('option'); o.value=v; o.textContent=v; el.appendChild(o); }); }
  var fieldOpts = ['자동차·전장 전체'].concat(AUTO.filter(function(t){return EV.some(function(e){return e.tags.indexOf(t)>=0;});}))
    .concat(['생성형AI','제조AI','디지털전환','AX전환','AI일반'].filter(function(t){return EV.some(function(e){return e.tags.indexOf(t)>=0;});}));
  fill('f-field', fieldOpts);
  var regions = {}; EV.forEach(function(e){ regions[e.region]=(regions[e.region]||0)+1; });
  fill('f-region', Object.keys(regions).sort(function(a,b){ return a==='기타'?1:b==='기타'?-1:regions[b]-regions[a]; }));
  var groups = {}; EV.forEach(function(e){ groups[e.group]=1; });
  fill('f-group', Object.keys(groups).sort());
  document.getElementById('f-sort').value = state.sort;

  function base(){
    var q = state.q.trim().toLowerCase();
    return EV.filter(function(e){
      if (state.quick==='new' && !e.is_new) return false;
      if (state.quick==='auto' && !e._auto) return false;
      if (state.quick==='ax' && !e._ax) return false;
      if (state.field){ if (state.field==='자동차·전장 전체' ? !e._auto : e.tags.indexOf(state.field)<0) return false; }
      if (state.region && e.region!==state.region) return false;
      if (state.group && e.group!==state.group) return false;
      if (q && e._hay.indexOf(q)<0) return false;
      return true;
    });
  }

  function renderTabs(list){
    var counts = {'전체':list.length}; KINDS.forEach(function(k){counts[k]=0;});
    list.forEach(function(e){counts[e.kind]=(counts[e.kind]||0)+1;});
    document.getElementById('tabs').innerHTML = ['전체'].concat(KINDS).map(function(k){
      var active = k==='전체' ? state.tabs.length===0 : state.tabs.indexOf(k)>=0;
      return '<button class="tab" data-tab="'+k+'" aria-pressed="'+active+'">'+k+'<span class="c num">'+counts[k]+'</span></button>';
    }).join('');
  }

  function sorter(a,b){
    if (state.sort==='deadline') return (a.deadline||'9999').localeCompare(b.deadline||'9999') || a.start.localeCompare(b.start);
    if (state.sort==='new') return (b.is_new-a.is_new) || a.start.localeCompare(b.start);
    return a.start.localeCompare(b.start) || a.title.localeCompare(b.title);
  }

  function row(e){
    var tags = e.tags.map(function(t){return '<span class="tag'+(AUTO.indexOf(t)>=0?' auto':'')+'">'+esc(t)+'</span>';}).join('');
    var dday = e._st.k==='ing' ? '' : (e._ds>0 ? '<span class="pill p-info num">D-'+e._ds+'</span>' : (e._ds===0?'<span class="pill p-info">D-DAY</span>':''));
    var dlTxt = e.deadline ? '<small class="num">신청 ~'+fmtShort(e.deadline)+'</small>' : '';
    var range = e.end && e.end!==e.start ? fmt(e.start)+' ~ '+fmtShort(e.end) : fmt(e.start);
    var meta = [];
    if (e.host) meta.push('<span>주최 <b>'+esc(e.host)+'</b></span>');
    if (e.fee) meta.push('<span>참가비 <b>'+esc(e.fee)+'</b></span>');
    meta.push('<span>출처 '+esc(e.sources.join(', '))+'</span>');
    meta.push('<span class="tags">'+tags+'</span>');
    return '<div class="row'+(e._closing?' soon':'')+'">'
      +'<div class="c-t"><div class="title-line"><span class="chip">'+esc(e.kind)+'</span><a href="'+esc(e.url)+'" target="_blank" rel="noopener">'+esc(e.title)+(e.is_new?' <span class="new">NEW</span>':'')+'</a></div>'
      +'<div class="meta">'+meta.join('')+'</div></div>'
      +'<div class="c-s status"><span class="pill '+e._st.c+'">'+e._st.t+'</span>'+dday+'</div>'
      +'<div class="c-r region">'+esc(e.region)+(e.online&&e.online!=='오프라인'&&e.region!==e.online?'<small style="display:block;color:var(--muted);font-size:11.5px">'+esc(e.online)+'</small>':'')+'</div>'
      +'<div class="c-w when num">'+range+dlTxt+'</div>'
      +'</div>';
  }

  function render(){
    var list = base();
    renderTabs(list);
    if (state.tabs.length) list = list.filter(function(e){return state.tabs.indexOf(e.kind)>=0;});
    list.sort(sorter);
    document.getElementById('rows').innerHTML = list.length ? list.map(row).join('')
      : '<div class="empty-state">조건에 맞는 행사가 없습니다. 검색어나 필터를 바꿔 보세요.</div>';
    document.querySelectorAll('.stat').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.quick===state.quick)); });
  }

  document.getElementById('tabs').addEventListener('click', function(ev){
    var b=ev.target.closest('.tab'); if(!b) return;
    var k = b.dataset.tab;
    if (k==='전체') { state.tabs = []; }
    else { var i = state.tabs.indexOf(k); if (i>=0) state.tabs.splice(i,1); else state.tabs.push(k); }
    render();
  });
  document.querySelectorAll('.stat').forEach(function(b){ b.addEventListener('click', function(){ state.quick = (state.quick===b.dataset.quick && b.dataset.quick!=='all') ? 'all' : b.dataset.quick; render(); }); });
  document.getElementById('q').addEventListener('input', function(ev){ state.q=ev.target.value; render(); });
  [['f-field','field'],['f-region','region'],['f-group','group']].forEach(function(p){
    document.getElementById(p[0]).addEventListener('change', function(ev){ state[p[1]]=ev.target.value; render(); });
  });
  document.getElementById('f-sort').addEventListener('change', function(ev){ state.sort=ev.target.value; try{localStorage.setItem('evr-state',JSON.stringify({sort:state.sort}));}catch(_){} render(); });

  // 하단: 수집처 현황
  var src = Object.keys(D.sources).map(function(k){ return '<div>'+esc(k)+' — '+esc(D.sources[k])+'</div>'; }).join('');
  document.getElementById('foot').innerHTML = '<span>수집 범위: 오늘부터 '+D.window_days+'일</span>'
    +'<span>휴대폰: 브라우저 메뉴에서 “홈 화면에 추가” 또는 “앱 설치”를 누르면 앱처럼 열려요</span>'
    +'<details><summary>수집처 '+Object.keys(D.sources).length+'곳 현황</summary><div class="srcs">'+src+'</div></details>';

  render();

  // 카카오톡 안에서 열면 앱 설치가 막히므로, 갤럭시에서는 기본 브라우저(크롬 등)로 자동 전환
  if (/KAKAOTALK/i.test(navigator.userAgent) && /\.github\.io$/.test(location.hostname)) {
    location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
  }
  // 앱 설치: 주소창 없이 앱처럼 열리게 한다 (GitHub 페이지에서만 동작, 아티팩트·로컬 파일에서는 건너뜀)
  var installEv = null, btn = document.getElementById('install');
  // 아이폰: 자동 설치 버튼이 없어서, 누르면 '홈 화면에 추가' 방법을 그림 없이 짧게 안내
  var isIOS = (/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1))
    && !navigator.standalone && /\.github\.io$/.test(location.hostname);
  if (isIOS) btn.hidden = false;
  function showGuide(){
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center';
    var safari = !/CriOS|FxiOS|EdgiOS/.test(navigator.userAgent);
    d.innerHTML = '<div style="background:#fff;color:#16233b;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:22px 22px 28px;font-size:16px;line-height:1.7">'
      + '<div style="font-size:18px;font-weight:700;margin-bottom:10px">아이폰에 앱 설치하기</div>'
      + (safari ? '' : '<div style="color:#c2410c;font-weight:700;margin-bottom:8px">※ 사파리(나침반 아이콘)에서 열어야 해요. 주소를 복사해 사파리에 붙여 넣어 주세요.</div>')
      + '<div>① 화면 아래 <b>공유 버튼</b>(네모에 위쪽 화살표 ⬆︎)을 누르세요</div>'
      + '<div>② 목록을 올려서 <b>홈 화면에 추가</b>를 누르세요</div>'
      + '<div>③ 오른쪽 위 <b>추가</b>를 누르면 끝! 바탕화면에 아이콘이 생겨요</div>'
      + '<button type="button" style="margin-top:16px;width:100%;height:44px;border:0;border-radius:10px;background:#1e3e78;color:#fff;font-size:16px;font-weight:700">확인</button></div>';
    d.addEventListener('click', function(e){ if (e.target === d || e.target.tagName === 'BUTTON') document.body.removeChild(d); });
    document.body.appendChild(d);
  }
  window.addEventListener('beforeinstallprompt', function(ev){ ev.preventDefault(); installEv = ev; btn.hidden = false; });
  btn.addEventListener('click', function(){
    if (!installEv) { if (isIOS) showGuide(); return; }
    installEv.prompt();
    installEv.userChoice.then(function(){ installEv = null; btn.hidden = true; });
  });
  window.addEventListener('appinstalled', function(){ btn.hidden = true; });
  try {
    if ('serviceWorker' in navigator && /\.github\.io$/.test(location.hostname)) {
      navigator.serviceWorker.register('sw.js');
    }
  } catch(_) {}
})();
</script>
